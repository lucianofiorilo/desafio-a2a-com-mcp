[project]
name = "central-de-salas-agente"
version = "1.0.0"
description = "Agente A2A v1.0 da Central de Salas: host MCP por dentro, servidor A2A por fora, sem LLM"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agente", "cliente_mcp", "tarefas"]
